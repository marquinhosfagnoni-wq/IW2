<body>

  <div class="card">
    <h1>Calculadora de velocidade</h1>

    <div class="campo">
      <label for="distancia">Distância (km)</label>
    <input type="number" id="distancia" placeholder="Ex: 150" min="0" />
    </div>

    <div class="campo">
      <label for="tempo">Tempo (horas)</label>
      <input type="number" id="tempo" placeholder="Ex: 2" min="0.01" step="0.01" />
    </div>

    <button onclick="calcular()">Calcular</button>
    <button onclick="limpar()">Limpar</button>
    <script>function calcular() {
      alert("Função de cálculo ainda não implementada!")

    

    }
    
    
  
      </script>

    <div class="resultado" id="resultado">

      <p class="valor" id="valor"></p>
      <img id="imagemFeedback" style="display:none; width:100px; margin-top:10px;" />
    </div>

    <div class="erro" id="erro"></div>
  </div>
